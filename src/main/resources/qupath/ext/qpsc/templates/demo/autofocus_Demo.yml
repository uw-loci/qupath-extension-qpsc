# ========== DEMO AUTOFOCUS CONFIGURATION (schema v2) ==========
#
# Paired with config_Demo.yml. The simulated slide lies on a focal surface
# that tilts and undulates between about -22 and +20 um of Z = 0, and the
# camera blurs the image by 0.35 px per micrometer from it, so the 5 um step
# below (60 um over 13 samples) moves the blur by about 1.75 px per step and
# the laplacian_variance curve has a single clear peak; the 60 um range covers
# the whole focal surface from any Z inside it. The brightfield binding uses
# the real dense_texture strategy with the production validity gates
# (texture_threshold, tissue_area_threshold); nothing here is a stub.

schema_version: 2

autofocus_settings:
  - objective: DEMO_OBJECTIVE_10X
    calibrated: true
    n_steps: 13
    search_range_um: 60.0
    n_tiles: 4
    interp_strength: 100
    interp_kind: quadratic
    score_metric: laplacian_variance
    texture_threshold: 0.010
    tissue_area_threshold: 0.2
    sweep_range_um: 20.0
    sweep_n_steps: 7
    gap_index_multiplier: 3
    gap_spatial_multiplier: 2.0

# ========== STRATEGY LIBRARY (v2) ==========
strategies:
  dense_texture:
    description: >
      Dense-tissue gate: score only fields that carry texture over enough
      of the frame. The virtual slide's tissue islands pass; bare glass
      between them defers to a neighbouring tile's focus.
    score_metric: laplacian_variance
    validity_check: texture_and_area
    validity_params:
      texture_threshold: 0.010
      tissue_area_threshold: 0.200
      rgb_brightness_threshold: 240.0
      tissue_mask_range: [0.10, 0.90]
      median_floor: 15.0
    on_failure: defer

  sparse_signal:
    description: >
      Scattered fluorescent objects on a dark field (the demo's DAPI
      nuclei, Cy5 puncta). No area gate; validity is a count of bright
      local maxima above an adaptive background.
    score_metric: laplacian_variance
    validity_check: bright_spot_count
    validity_params:
      spot_sigma_above_bg: 4.0
      spot_min_separation_px: 8
      min_spots: 2
      min_peak_intensity: 20.0
      bright_pixel_floor: 50.0
      saturation_threshold: 0.03
    on_failure: proceed

  manual_only:
    description: >
      Always fails validity so the manual-focus dialog appears. Bind a
      modality to this to see that path without a real failure.
    score_metric: none
    validity_check: always_false
    validity_params: {}
    on_failure: manual

# ========== PER-MODALITY STRATEGY BINDINGS (v2) ==========
modalities:
  brightfield:
    strategy: dense_texture
  bf:
    strategy: dense_texture
  fluorescence:
    strategy: sparse_signal
  lcpolscope:
    strategy: dense_texture
    overrides:
      validity_params:
        # Polarized light spreads intensity wider than brightfield and a
        # polarization image is mostly dark, as on the real LC-PolScope.
        tissue_mask_range: [0.05, 0.95]
        texture_threshold: 0.005
        tissue_area_threshold: 0.1
